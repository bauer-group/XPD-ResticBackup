# =============================================================================
# Fixture: a configuration file that must lint CLEAN
# =============================================================================
# Deliberately exercises every shape the linter has to accept, because each of
# them has been a false rejection at some point:
#
#   * a full-line comment and an indented one
#   * a blank line and a whitespace-only line
#   * a trailing comment containing BACKTICKS - this rejected the shipped
#     example configuration until the linter learned to strip comments
#   * `export` prefixes, as used in the credential files
#   * single-line and multi-line arrays
#   * a value containing a '#' inside quotes, which is NOT a comment
# =============================================================================

BGB_HOSTNAME="host.rig.invalid"
  # an indented comment

BGB_REPO_ROLE="primary"
BGB_LOG_LEVEL="info"

JOB_ENABLED=1
JOB_MODE="files"
JOB_VERIFY_SAMPLE=5                 # files restored and hashed by `verify`
JOB_DESCRIPTION="tagged #1 backup"

JOB_TAGS=( tier=os legacy-stopped )

JOB_PATHS=(
  /srv/data
  "/srv/my data"
  /etc
)

export RESTIC_REPOSITORY='s3:https://minio.rig.invalid/bucket/host.rig.invalid'
export AWS_DEFAULT_REGION='eu-north1'

JOB_KEEP_DAILY="30"
JOB_KEEP_WEEKLY="8"
JOB_KEEP_MONTHLY="6"
