# =============================================================================
# Fixture: command substitution the linter MUST reject
# =============================================================================
# Sourcing a configuration file executes it as root, so $( ) in a VALUE is
# arbitrary code execution. Rejected before the file is ever sourced.
#
# Note the contrast with config-valid.conf, which contains backticks inside a
# trailing COMMENT and must be accepted.
# =============================================================================

JOB_ENABLED=1
JOB_PATHS=( $(whoami) )
