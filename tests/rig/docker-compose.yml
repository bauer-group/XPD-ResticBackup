# =============================================================================
# bg-backup integration rig
# =============================================================================
#   make rig-up            start MinIO and apply the declarative init config
#   make integration       run the installer end to end in a clean Ubuntu
#   make dr-rehearse       seed, back up, destroy, restore, assert
#
# THE BACKEND IS THE BAUER GROUP MinIO STACK. Server and the one-shot init
# container are the same images the platform runs in production
# (ghcr.io/bauer-group/cs-minio/*), and the rig's buckets, IAM policies and
# users are declared in tests/rig/minio-init.json rather than in shell here.
# That is the point: what gets exercised is the deployment shape we actually
# ship, not a hand-rolled approximation of it that is free to drift.
#
# PORT 9800, NOT 9000. A rig that steals a developer's default MinIO port is a
# rig nobody starts twice.
#
# EXIT 0 FROM minio-init IS NOT PROOF. Its policy task logs a failed
# `mc admin policy create` in red but does not raise, so the container reports
# success with no policy in place. tests/rig/up.sh re-reads the attachment from
# the server afterwards; that check is what makes the least-privilege premise
# true rather than assumed. Do not drop it, and do not replace up.sh with
# `docker compose up --wait`.
#
# Credentials here are throwaway literals, allowlisted BY NAME in .gitleaks.toml
# so the scanner stays useful everywhere else.
# =============================================================================

name: bgb-rig

x-throwaway: &throwaway
  # Deliberately unmistakable. A realistic-looking fake would train reviewers to
  # skim past key-shaped strings, which is how the leak this project started
  # with happened in the first place.
  MINIO_ROOT_USER: bgb-rig-root
  MINIO_ROOT_PASSWORD: bgb-rig-root-secret

# Required by the init image's BUILT-IN default config, which main.py loads
# UNCONDITIONALLY before ours - leave these unset and the container aborts with
# "Environment variable 'CONSOLE_USER' is not set" before it reaches a single
# line of tests/rig/minio-init.json.
#
# That default mints an administrator (admin:* + s3:*). It is deliberately NOT
# part of *identities below and therefore never reaches a victim container: a
# host that could authenticate as this user would satisfy every permission
# assertion in every suite no matter how wrong the scoped policy was. The rig
# already has one all-powerful identity in the root account; it does not get a
# second one with a shorter name.
x-console-admin: &console-admin
  CONSOLE_USER: bgb-rig-console
  CONSOLE_PASSWORD: bgb-rig-console-secret

# Every identity the rig hands to a victim container. TWO, not one, because
# ADR-0005 splits backup from prune: the backup identity may not delete anything
# outside its locks/ prefix, and only the prune identity may. One all-powerful
# test credential would make both of those assertions vacuous.
#
# There is no third identity for the copy target - see the note in
# minio-init.json: restic authenticates both sides of an S3-to-S3 copy with the
# same AWS_* variables, so the maintenance suite copies to the rest-server.
x-identities: &identities
  BGB_IT_BUCKET: ${BGB_IT_BUCKET:-bgb-it}
  BGB_IT_REGION: ${BGB_IT_REGION:-eu-north1}
  BGB_IT_PREFIX: ${BGB_IT_PREFIX:-victim.rig.invalid}
  BGB_IT_ACCESS_KEY: ${BGB_IT_ACCESS_KEY:-bgb-it-ci-user}
  BGB_IT_SECRET_KEY: ${BGB_IT_SECRET_KEY:-bgb-it-ci-throwaway-secret}
  BGB_IT_PRUNE_ACCESS_KEY: ${BGB_IT_PRUNE_ACCESS_KEY:-bgb-it-ci-prune}
  BGB_IT_PRUNE_SECRET_KEY: ${BGB_IT_PRUNE_SECRET_KEY:-bgb-it-ci-throwaway-prune-secret}

services:

  minio:
    image: ${BGB_MINIO_IMAGE:-ghcr.io/bauer-group/cs-minio/minio}:${BGB_MINIO_VERSION:-latest}
    environment:
      <<: *throwaway
      MINIO_REGION_NAME: ${BGB_IT_REGION:-eu-north1}
      MINIO_BROWSER: "off"
    ports:
      - "${BGB_RIG_API_PORT:-9800}:9000"
    # The image ships a HEALTHCHECK, but at a 30s interval with a 30s start
    # period - sane for a long-lived deployment, and close to a minute of dead
    # time on every CI run. The probe itself is the image's; only the timing is
    # overridden, and only for the rig.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - minio_data:/data
    networks: [rig]

  # One-shot, declarative, idempotent. This is why the workflow drives docker
  # compose rather than using GitHub Actions `services:`, which cannot express a
  # container that must run to completion before the others start.
  #
  # Buckets, policies and users come from tests/rig/minio-init.json. Secrets are
  # injected as ${VAR} placeholders resolved from this environment - an unset
  # variable is a hard error inside the container, so a typo fails the rig
  # instead of silently creating a user literally named '${BGB_IT_ACCESS_KEY}'.
  minio-init:
    image: ${BGB_MINIO_INIT_IMAGE:-ghcr.io/bauer-group/cs-minio/minio-init}:${BGB_MINIO_INIT_VERSION:-latest}
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"
    environment:
      <<: [*throwaway, *console-admin, *identities]
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WAIT_TIMEOUT: ${BGB_RIG_TIMEOUT:-120}
      MINIO_INIT_CONFIG: /app/config/init.json
    volumes:
      - ./minio-init.json:/app/config/init.json:ro
    networks: [rig]

  # A second backend so the append-only path is exercised rather than only
  # documented. rest-server refuses DELETE except on locks, which is the
  # strongest ransomware control available to restic today. The maintenance
  # suite reaches it as rest:http://rest-server:8000/<repo>/ and uses two paths:
  # one as the `copy` destination, one to prove that a delete is refused.
  #
  # NO --create-repo here, however plausible the name: this image rejects the
  # flag outright ("error: unknown flag: --create-repo") and the container then
  # exits 1 at startup, which surfaces much later as restic being unable to
  # resolve the host. Repository creation needs no server flag - `restic init`
  # requests it with ?create=true, and append-only permits it because creating a
  # repository only ever adds objects.
  rest-server:
    image: restic/rest-server:latest
    environment:
      DISABLE_AUTHENTICATION: "1"
      OPTIONS: "--append-only"
    volumes:
      - rest_data:/data
    networks: [rig]

  # A throwaway receiver for the notification channels. The unit suite proves
  # only that each provider file LOADS; nothing ever showed that a delivery
  # leaves the host. tests/e2e/notify.sh points the webhook, Teams and Uptime
  # Kuma URLs here and then reads the recording back from /_requests.
  #
  # python:3-alpine with the script mounted, rather than a purpose-built image:
  # the rig should not need a build step for eighty lines of stdlib.
  webhook-sink:
    image: python:3.13-alpine
    command: ["python3", "/opt/sink.py", "8080"]
    volumes:
      - ./webhook-sink.py:/opt/sink.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/_requests')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks: [rig]

  # The host being backed up.
  victim:
    build:
      context: ../..
      dockerfile: tests/rig/Dockerfile.victim
      args:
        UBUNTU_TAG: ${BGB_UBUNTU_TAG:-26.04}
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment: &rig_env
      <<: *identities
      BGB_IT_ENDPOINT: http://minio:9000
      BGB_IT_REST_ENDPOINT: http://rest-server:8000
      BGB_IT_SINK: http://webhook-sink:8080
      BGB_IT_RESTIC_PASSWORD: ${BGB_IT_RESTIC_PASSWORD:-bgb-it-ci-throwaway-repo-passphrase}
    volumes:
      - dr_evidence:/evidence
    networks: [rig]

  # A host that BOOTS systemd, so a timer can actually fire and LoadCredential
  # can actually deliver. Everywhere else in this rig systemd is installed but
  # never started, which limits the scheduling suite to verifying unit FILES.
  #
  # Reached with `docker compose exec`, never `run`: run replaces the command
  # and systemd would not boot. See Dockerfile.systemd-victim.
  systemd-victim:
    build:
      context: ../..
      dockerfile: tests/rig/Dockerfile.systemd-victim
      args:
        UBUNTU_TAG: ${BGB_UBUNTU_TAG:-26.04}
    depends_on:
      minio-init: {condition: service_completed_successfully}
    privileged: true
    # Both are required. Without the host cgroup namespace systemd refuses to
    # start ("Failed to create /init.scope control group"); without the bind
    # mount it cannot manage the hierarchy it was given.
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    environment: *rig_env
    # systemd shuts down on SIGRTMIN+3; the default SIGTERM makes it reboot
    # instead, and `compose down` then waits out the full timeout.
    stop_signal: SIGRTMIN+3
    networks: [rig]

  # A host that runs its OWN Docker daemon, for JOB_MODE=docker. Privileged
  # because dockerd needs it; /var/lib/docker is a volume so the storage driver
  # gets a real filesystem. See Dockerfile.docker-victim for why the host
  # socket is not an option.
  docker-victim:
    build:
      context: ../..
      dockerfile: tests/rig/Dockerfile.docker-victim
      args:
        UBUNTU_TAG: ${BGB_UBUNTU_TAG:-26.04}
    depends_on:
      minio-init: {condition: service_completed_successfully}
    privileged: true
    environment: *rig_env
    volumes:
      - dind_lib:/var/lib/docker
      - dr_evidence:/evidence
    networks: [rig]

  # A FRESH host that has never seen the data. It receives only what the
  # recovery sheet lists - if the rehearsal needs anything else, the sheet is
  # wrong, and that is a finding rather than an inconvenience.
  phoenix:
    build:
      context: ../..
      dockerfile: tests/rig/Dockerfile.phoenix
      args:
        UBUNTU_TAG: ${BGB_UBUNTU_TAG:-26.04}
    environment: *rig_env
    volumes:
      - dr_evidence:/evidence
    networks: [rig]

networks:
  rig: {}

volumes:
  minio_data: {}
  rest_data: {}
  dr_evidence: {}
  dind_lib: {}
