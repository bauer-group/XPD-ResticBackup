# =============================================================================
# XPD-ResticBackup - pre-commit hooks
# =============================================================================
# Install once:  pip install pre-commit && pre-commit install
#
# The gitleaks hook is the one that matters most: it catches a credential on the
# developer's machine, before the network is ever involved.
# =============================================================================

minimum_pre_commit_version: '3.5.0'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ['--severity=warning', '--external-sources']

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-1
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci', '-bn', '-d']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md,MD']
        exclude: '\.asc$'
      - id: end-of-file-fixer
        exclude: '\.asc$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: detect-private-key
        exclude: 'share/restic/restic-release-key\.asc$'
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
