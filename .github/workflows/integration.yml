# =============================================================================
# bg-backup - Integration (Docker rig, real restic, real S3 API)
# =============================================================================
# BAUER GROUP | https://github.com/bauer-group/XPD-ResticBackup
#
# What CI cannot answer: does the installer actually install, does restic really
# talk to an S3-compatible backend, may the backup identity delete repository
# data, and can a destroyed host be rebuilt from nothing but a repository and a
# passphrase. This workflow runs the throwaway BAUER GROUP MinIO rig from
# tests/rig/ and rehearses exactly that - on EVERY push to main, not nightly.
#
# EVERY SUITE, EVERY PUSH. docker-stack.sh and db-engines.sh used to be
# reachable only through `make`, so the JOB_MODE=docker path and all eight
# database engines were "proved" exactly as often as somebody remembered to
# type the command. They are matrix legs here now.
#
# UBUNTU 26.04 ONLY, DELIBERATELY. A structural defect appears on every release,
# so a three-distro e2e matrix mostly buys three copies of the same answer. The
# one thing 26.04 cannot see is syntax that only exists from bash 5.2 onward
# (${var@U}, the new `wait -p`): green here, dead on a 22.04 production host.
# That gap is covered for ~20 seconds by the "bash 5.1 parse" job in ci.yml, not
# by tripling this workflow's runtime.
#
# ONE FRESH RIG PER LEG. The suites assert exact snapshot counts against one
# repository prefix, and restic leaves a lock behind when a run is interrupted.
# Sharing a backend between suites makes them read each other's snapshots and
# each other's debris, which produces failures that move around between runs.
# Each matrix leg gets its own runner and therefore its own rig.
#
# NEVER PIPE THE SUITE. `docker compose run ... | tail` reports TAIL's exit
# status, so a suite that failed every assertion looks green. Every invocation
# below is bare, and its exit status is the step's.
#
# WHY NOT `services:` / job-level `container:`
#   * The rig needs a ONE-SHOT init container: MinIO comes up empty and the
#     declarative init has to run to completion before anything else starts.
#     GitHub's `services:` has no notion of a container that is supposed to
#     finish, and no ordering between services.
#   * Job-level `container:` would run the steps INSIDE a container, which then
#     needs the Docker socket to build the victim image - docker-in-docker for
#     no benefit.
#   Driving `docker compose` from the runner keeps one compose file that works
#   identically on a developer laptop (`make integration`) and here.
#
# NO SECRETS. The rig credentials are throwaway literals in the compose file,
# allowlisted by name in .gitleaks.toml and asserted against by the redaction
# regression test. Nothing here may ever be pointed at a real bucket.
# =============================================================================

name: 🧪 Integration

on:
  # No `paths:` filter. This workflow is the answer to "does main still work",
  # and a change to a Makefile target, a workflow or a document can break the
  # rig just as effectively as a change to lib/.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:17 UTC daily. Off the hour on purpose: the top of the hour is when
    # every scheduled workflow on GitHub fires and queue time balloons.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BGB_UBUNTU_TAG: '26.04'
  COMPOSE_FILE: tests/rig/docker-compose.yml

jobs:
  # ===========================================================================
  # One leg per suite. Each brings up its own rig from scratch.
  # ===========================================================================
  e2e:
    name: 🧪 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Never fail-fast: if the docker leg breaks we still want to know whether
      # maintenance broke the same way. "One leg cancelled the others" turns a
      # three-line answer into a bisect.
      fail-fast: false
      matrix:
        include:
          - name: Installer
            suite: installer.sh
            service: victim
          - name: Maintenance (check/verify/prune/copy)
            suite: maintenance.sh
            service: victim
          - name: Docker stack
            suite: docker-stack.sh
            service: docker-victim
          - name: Database engines
            suite: db-engines.sh
            service: docker-victim

    env:
      # Distinct per leg so two legs can never collide if they ever land on the
      # same self-hosted runner.
      COMPOSE_PROJECT_NAME: bgbrig${{ strategy.job-index }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 🔧 Show toolchain
        run: |
          docker --version
          docker compose version
          echo "victim base image: ubuntu:${BGB_UBUNTU_TAG}"

      - name: 🪣 Start the rig backend
        # up.sh does what `docker compose up --wait` cannot: it waits for the
        # run-to-completion init container, and then READS THE RESULT BACK off
        # the server. The init container logs a failed policy in red but still
        # exits 0, so its exit code alone would let a rig with no least-privilege
        # policy report itself ready - and every permission assertion downstream
        # would be vacuous.
        run: bash tests/rig/up.sh

      - name: 🏗️ Build ${{ matrix.service }}
        run: docker compose build ${{ matrix.service }}

      - name: 🧪 ${{ matrix.suite }}
        # Bare on purpose - see the header. No pipe, no `|| true`.
        run: docker compose run --rm ${{ matrix.service }} /opt/bgb/tests/e2e/${{ matrix.suite }}

      - name: 📜 Collect rig logs
        if: failure()
        run: |
          mkdir -p rig-logs
          docker compose ps -a >rig-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps >rig-logs/compose.log 2>&1 || true

      - name: 📤 Upload rig logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rig-logs-${{ matrix.suite }}
          path: rig-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 Tear down rig
        # `always()` and `-v`: a leaked MinIO volume on a self-hosted runner
        # would carry a previous run's repository into the next one, and a
        # rehearsal that restores yesterday's snapshot proves nothing.
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # The disaster-recovery rehearsal is a sequence across two hosts, not a single
  # suite invocation, so it gets its own job rather than a matrix leg.
  # ===========================================================================
  dr:
    name: 🔥 DR rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: bgbrigdr

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 🪣 Start the rig backend
        run: bash tests/rig/up.sh

      - name: 🏗️ Build victim and phoenix
        run: |
          docker compose build victim
          docker compose build phoenix

      - name: 🌱 Seed and back up
        run: docker compose run --rm victim /opt/bgb/tests/e2e/dr-seed-and-backup.sh

      - name: 💥 Destroy the victim host
        # The whole point of the rehearsal: the machine that made the backup no
        # longer exists. -f -s -v also removes its volumes, so nothing but the
        # repository in MinIO survives into the next step.
        run: docker compose rm -fsv victim

      - name: 🚑 Restore onto a host that has never seen the data
        # phoenix gets the repository URL and the passphrase and nothing else,
        # and must reconstruct the seeded tree byte for byte.
        run: docker compose run --rm phoenix /opt/bgb/tests/e2e/dr-restore-and-assert.sh

      - name: 📜 Collect rig logs
        if: failure()
        run: |
          mkdir -p rig-logs
          docker compose ps -a >rig-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps >rig-logs/compose.log 2>&1 || true

      - name: 📤 Upload rig logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rig-logs-dr
          path: rig-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 Tear down rig
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: 📊 Integration Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e, dr]
    if: always()
    steps:
      - name: 📊 Write job summary
        env:
          R_E2E: ${{ needs.e2e.result }}
          R_DR: ${{ needs.dr.result }}
        run: |
          mark() { case "$1" in success) echo "✅" ;; skipped) echo "⏭️" ;; *) echo "❌" ;; esac; }
          {
            echo "## 🧪 Integration (Ubuntu ${BGB_UBUNTU_TAG}, real MinIO, real restic)"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| 🧪 e2e suites (installer, maintenance, docker, databases) | $(mark "${R_E2E}") ${R_E2E} |"
            echo "| 🔥 DR rehearsal | $(mark "${R_DR}") ${R_DR} |"
            echo
            echo "> Every suite ran against its own fresh rig. A green result here"
            echo "> says nothing about bash 5.1 - that is the 'bash 5.1 parse' job"
            echo "> in CI."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: 🚦 Enforce aggregate result
        env:
          RESULTS: ${{ needs.e2e.result }} ${{ needs.dr.result }}
        run: |
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::An integration gate did not pass (${RESULTS})"
              exit 1
            fi
          done
          echo "All integration gates passed."
