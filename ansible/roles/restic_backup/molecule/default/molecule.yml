---
# =============================================================================
# molecule: restic_backup / default
# =============================================================================
# The three Ubuntu releases the product supports. 22.04 is listed FIRST because
# it has the oldest bash (5.1) and systemd (249): a scenario that passes on
# 26.04 and fails on 22.04 means somebody used newer syntax, and finding that
# here is far cheaper than finding it on the oldest production host.
#
# The converge runs with restic_backup_test_mode: true, so nothing is downloaded,
# installed or started. What IS exercised is everything that can go wrong without
# a network: template rendering, file modes, unit syntax, and the assertions.
# =============================================================================

driver:
  name: docker

platforms:
  - name: molecule-restic-backup-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

  - name: molecule-restic-backup-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

  - name: molecule-restic-backup-ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      stdout_callback: ansible.builtin.default
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        ansible_become_method: su

verifier:
  name: ansible
