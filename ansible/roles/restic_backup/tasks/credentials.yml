---
# =============================================================================
# restic_backup Role - Credentials
# =============================================================================
# Everything in this file carries no_log: true. Not because Ansible would print
# the value by default on success, but because it prints module arguments on
# FAILURE and in --diff — and a failed converge is exactly the moment somebody
# pastes the whole output into a ticket.
#
# Nothing here ever puts a secret on a command line: /proc/<pid>/cmdline is
# world-readable, /proc/<pid>/environ is not, and a 0400 file is neither.
# =============================================================================

- name: "[restic_backup][credentials] Ensure the configuration root exists"
  ansible.builtin.file:
    path: "{{ restic_backup_confdir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "[restic_backup][credentials] Ensure the credentials directory exists"
  ansible.builtin.file:
    path: "{{ restic_backup_credentials_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# --- Repository passphrase ---------------------------------------------------
# force: false — the passphrase file is CREATED once and then never rewritten.
#
# restic derives the repository master key from the passphrase at init time.
# Overwriting repo.key with a different value does not "change the password",
# it makes every existing snapshot unreadable from this host: the new value
# simply does not unlock any key file in the repository. Rotation is a restic
# operation (`restic key add` / `key remove`) that has to happen against the
# repository first, with the old passphrase still in hand.
#
# So Ansible seeds it and then keeps its hands off. Drift is detected and
# reported below instead of being "fixed".
- name: "[restic_backup][credentials] Seed the repository passphrase"
  ansible.builtin.copy:
    content: "{{ restic_backup_password }}\n"
    dest: "{{ restic_backup_repo_key }}"
    owner: root
    group: root
    mode: "0400"
    force: false
  no_log: true

- name: "[restic_backup][credentials] Read the passphrase currently on disk"
  ansible.builtin.slurp:
    src: "{{ restic_backup_repo_key }}"
  register: restic_backup_repo_key_raw
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: "[restic_backup][credentials] Detect passphrase drift"
  ansible.builtin.set_fact:
    restic_backup_password_drift: >-
      {{ (restic_backup_repo_key_raw.content | default('') | b64decode | trim)
         not in ['', restic_backup_password] }}
  no_log: true

- name: "[restic_backup][credentials] Report passphrase drift"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ restic_backup_repo_key }} does not match the passphrase in
      the vault for {{ inventory_hostname }}. Ansible has NOT overwritten it —
      doing so would lock this host out of its own repository. Either the vault
      entry is stale, or a passphrase was rotated on the host without
      `restic key add`. Resolve it by hand before the next restore test.
  when: restic_backup_password_drift | bool

- name: "[restic_backup][credentials] Fail on passphrase drift"
  ansible.builtin.fail:
    msg: >-
      restic_backup_password_drift_fatal is set and the on-disk passphrase for
      {{ inventory_hostname }} differs from the vault.
  when:
    - restic_backup_password_drift | bool
    - restic_backup_password_drift_fatal | default(false) | bool

# --- Repository environment --------------------------------------------------
# Rewritten on every converge: backend access keys are rotatable without any
# consequence for existing snapshots, which is exactly what the passphrase is
# not.
- name: "[restic_backup][credentials] Render the repository environment"
  ansible.builtin.template:
    src: repo.env.j2
    dest: "{{ restic_backup_repo_env }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true

# --- Secondary repository ----------------------------------------------------
- name: "[restic_backup][credentials] Seed the secondary repository passphrase"
  ansible.builtin.copy:
    content: "{{ restic_backup_secondary_password }}\n"
    dest: "{{ restic_backup_secondary_repo_key }}"
    owner: root
    group: root
    mode: "0400"
    force: false
  no_log: true
  when: restic_backup_secondary_repo_base | length > 0

- name: "[restic_backup][credentials] Render the secondary repository environment"
  ansible.builtin.template:
    src: repo.env.j2
    dest: "{{ restic_backup_secondary_repo_env }}"
    owner: root
    group: root
    mode: "0400"
  vars:
    restic_backup_repo_env_repository: "{{ restic_backup_secondary_repository }}"
    restic_backup_repo_env_key_file: "{{ restic_backup_secondary_repo_key }}"
    restic_backup_repo_env_access_key: "{{ restic_backup_secondary_s3_access_key }}"
    restic_backup_repo_env_secret_key: "{{ restic_backup_secondary_s3_secret_key }}"
    restic_backup_repo_env_role: "secondary"
  no_log: true
  when: restic_backup_secondary_repo_base | length > 0

# --- Notifier credentials ----------------------------------------------------
# A push URL and a Teams webhook are bearer credentials: whoever holds them can
# post as this host's monitor. They therefore live at 0400 in credentials/ and
# reach bg-backup through the systemd EnvironmentFile, never through the 0640
# bg-backup.conf that operators read over the shoulder.
- name: "[restic_backup][credentials] Render the notifier environment"
  ansible.builtin.template:
    src: notify.env.j2
    dest: "{{ restic_backup_notify_env }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: >-
    (restic_backup_kuma_push_url | length > 0)
    or (restic_backup_teams_webhook_url | length > 0)
    or (restic_backup_webhook_url | length > 0)

# --- Recovery bundle recipients ----------------------------------------------
# age PUBLIC keys — not secret, but they belong with the material they protect,
# and a wrong recipient list is a recovery bundle nobody can open.
- name: "[restic_backup][credentials] Write the recovery-bundle recipients"
  ansible.builtin.copy:
    content: "{{ restic_backup_escrow_recipients | join('\n') }}\n"
    dest: "{{ restic_backup_escrow_recipients_file }}"
    owner: root
    group: root
    mode: "0400"
  when: restic_backup_escrow_recipients | length > 0
